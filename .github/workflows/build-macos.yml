name: Build macOS arm64

on:
  push:
    branches: [opencode-2.2.6-macos]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner arch
        run: uname -m

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/claude-notifications-darwin-arm64 ./cmd/claude-notifications

      - name: Smoke test binary
        run: ./dist/claude-notifications-darwin-arm64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: claude-notifications-darwin-arm64
          path: dist/claude-notifications-darwin-arm64
          if-no-files-found: error
